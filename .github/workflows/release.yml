name: Release

# Publishes to crates.io through trusted publishing: the workflow authenticates with the
# repository's OIDC token and crates.io checks that the token came from this repository, so
# no long-lived secret is ever stored in GitHub.
#
# A tag of the form `v<version>` triggers a publish of every workspace crate whose
# version in `Cargo.toml` matches that tag. The versions are read from the manifests, so
# the tag and the manifests cannot disagree.
#
# Setting this up needs one thing that only the repository owner can do, once the crate
# exists on crates.io (trusted publishing cannot create a crate, so the first version is
# published locally with an API token):
#
#   On crates.io: bevy_fairy -> Settings -> Trusted Publishing -> add a GitHub publisher for
#   this repository, with the workflow filename `release.yml`.
#
# Nothing is needed in GitHub. Until the publisher is added, a tag push for a new version
# fails at "Authenticate with crates.io". The dry run before it still passes, so a failure
# there is a configuration problem, not a packaging problem.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the publish'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing needs this to mint the OIDC token.
      id-token: write
      # The publish step reads the manifests and the lockfile.
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # The tag names the version. A tag that does not match a manifest is a mistake, and
    # publishing a version the manifests do not agree with is worse than not publishing.
    - name: Read the version from the tag
      id: version
      run: |
        tag="${GITHUB_REF_NAME}"
        version="${tag#v}"
        if [ "$version" = "$tag" ]; then
          echo "::error::The tag $tag does not start with 'v'. It must be v<version>."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Check the manifests agree with the tag
      run: |
        version="${{ steps.version.outputs.version }}"
        failed=0
        for manifest in Cargo.toml crates/*/Cargo.toml; do
          [ -f "$manifest" ] || continue
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' "$manifest" | head -1)
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)
          if [ "$crate_version" = "$version" ]; then
            echo "publishing $name $crate_version"
          else
            echo "::error::$manifest is version $crate_version, not $version."
            failed=1
          fi
        done
        exit $failed

    # The gate that has to pass before anything is uploaded. This is the same gate the
    # improvement loop runs: the ratchet, then the test suite, then the docs.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

    - name: Run the clippy ratchet
      run: ./scripts/ratchet.sh

    - name: Run the test suite
      run: cargo test --workspace --no-fail-fast

    - name: Build the documentation
      run: cargo doc --no-deps --workspace
      env:
        RUSTDOCFLAGS: "-D warnings"

    - name: Check the package contents
      run: |
        cargo package --list --workspace | tee packages.txt
        if grep -E '^\.env|(^|/)\.cargo/credentials|secrets?\.' packages.txt; then
          echo "::error::The package list contains something that looks like a secret."
          exit 1
        fi

    # A version already on crates.io is not published again: the first version of a crate goes
    # out by a local publish (trusted publishing cannot create a crate), and the tag for it
    # still triggers this workflow. Every later version is new here and goes through. The
    # registry is asked over its API, because `cargo info` run inside this workspace reports
    # the local manifest for a name that is a workspace member.
    - name: Is this version already on crates.io?
      id: published
      run: |
        version="${{ steps.version.outputs.version }}"
        if curl -sf -A "bevy_fairy release workflow (github.com/bevy-coven/bevy_fairy)" \
            "https://crates.io/api/v1/crates/bevy_fairy/$version" >/dev/null; then
          echo "bevy_fairy@$version is already on crates.io; nothing to publish."
          echo "already=true" >> "$GITHUB_OUTPUT"
        else
          echo "already=false" >> "$GITHUB_OUTPUT"
        fi

    # `--dry-run` does everything the real publish does except upload. It is run first so
    # that a packaging problem is reported as a packaging problem, not as an upload failure.
    - name: Dry run
      if: ${{ steps.published.outputs.already != 'true' }}
      run: cargo publish --workspace --dry-run

    # Cargo does not mint a crates.io token from the job's OIDC token by itself. This action
    # exchanges it for a token that lives 30 minutes and is revoked when the job ends, so no
    # long-lived secret is stored in GitHub.
    - name: Authenticate with crates.io
      id: auth
      if: ${{ !inputs.dry_run && steps.published.outputs.already != 'true' }}
      uses: rust-lang/crates-io-auth-action@v1

    - name: Publish
      if: ${{ !inputs.dry_run && steps.published.outputs.already != 'true' }}
      run: cargo publish --workspace
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    - name: Verify the release
      if: ${{ !inputs.dry_run }}
      run: |
        version="${{ steps.version.outputs.version }}"
        curl -sf -A "bevy_fairy release workflow (github.com/bevy-coven/bevy_fairy)" \
          "https://crates.io/api/v1/crates/bevy_fairy/$version" >/dev/null \
          || { echo "::error::bevy_fairy@$version is not on crates.io."; exit 1; }
