name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  check:
    name: fmt + clippy ratchet + test + doc
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The ratchet stands in for `cargo clippy --all-targets --all-features -- -D warnings`
      # until the debt it freezes is paid. `main` was already red when the improvement loop
      # began: clippy reports over a thousand warnings. The ratchet fails only when
      # something NEW breaks, so a red build means a real regression. When every `known_red`
      # count in docs/loop/metrics.json reaches zero, delete the ratchet and put the clippy line
      # back, and `--all-features` back on the two steps below.
      - run: ./scripts/ratchet.sh
      - run: xvfb-run -a cargo test --workspace --no-fail-fast
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
